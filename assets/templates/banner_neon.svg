<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Khung banner neon xanh hồng</title>
  <desc id="desc">Khung vector trong suốt bo góc với viền xanh cyan, nền xanh đậm và tab tiêu đề hồng.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d82"/>
      <stop offset="0.58" stop-color="#06458e"/>
      <stop offset="1" stop-color="#03234f"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4260"/>
      <stop offset="1" stop-color="#ff304e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#00e5ff" flood-opacity="0.4"/>
    </filter>
